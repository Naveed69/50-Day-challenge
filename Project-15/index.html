<html>
  <head>
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
  </head>
  <body>
    <div class="product-card">
      <div class="img">
        <img
          src="./image-product-desktop.jpg"
          alt="A bottle of perfume surrounded by foliage"
        />
      </div>
      <div class="product-info">
        <p class="category">Perfume</p>
        <h1>Gabrielle Essence Eau De Parfum</h1>
        <div class="product-desc">
          <p>
            A floral, solar and voluptuous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.
          </p>
        </div>
        <div class="pricing">
          <span class="sale-price">$149.99</span>
          <span class="list-price">$169.99</span>
        </div>
        <div class="button-container">
          <button type="button" class="add-to-cart">
            <i
              class="fa fa-shopping-cart"
              style="font-size: 16px; color: white"
            ></i>
            Add to Cart
          </button>
        </div>
      </div>
    </div>
    <footer>
      <p class="attribution">
        Challenge By <a href="https://www.crio.do" target="_blank">Crio</a>.
        Coded by
        <a
          href="https://www.linkedin.com/in/naveed-desai-bab353196/"
          target="_blank"
          >Naveed</a
        >
      </p>
    </footer>
  </body>
</html>
