<html>
  <head>
    <title>Marks/Scores</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="main">
      <div class="left">
        <p style="font-weight: bold; font-size: 22">Your Result</p>
        <div class="score">
          <div style="font-size: 56px; font-weight: bold">76</div>
          <span style="color: rgb(190, 190, 190); font-size: 20px">of 100</span>
        </div>
        <div class="conclusio">
          <p style="font-weight: bold; font-size: 20">Great</p>
          <p class="conclusion" style="font-size: bold; text-align: center">
            you scored higher than 65% of the people who have taken these tests
          </p>
        </div>
      </div>
      <div class="right">
        <p>Summary</p>
        <div class="reaction">
          <span>Reaction</span>
          <span>80/100</span>
        </div>
        <div class="memory">
          <span>Memory</span>
          <span>92/100</span>
        </div>
        <div class="verbal">
          <span>Verbal</span>
          <span>61/100</span>
        </div>
        <div class="visual">
          <span>Visual</span>
          <span>72/100</span>
        </div>
        <button type="button" class="btn">Continue</button>
      </div>
    </div>
  </body>
</html>
